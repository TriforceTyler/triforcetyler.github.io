<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-135255146-1"></script>
    <script>window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag('js', new Date()); gtag('config', 'UA-135255146-1');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Menu Generator</title>

    <meta property="og:description" content="Generate and save custom Geometry Dash menus!">
    <meta property="og:title" content="Geometry Dash Menu Generator">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="./assets/logo.png">

    <style>
    body {
        background-color: #287DFF;
        background-size: cover;
        background-attachment: fixed;
        background-image: url('./assets/background.jpg');
    }
    body div { display: none; }
    </style>
  <script type="module" crossorigin src="./build/index-DXT6PGz_.js"></script>
  <link rel="modulepreload" crossorigin href="./build/Geometry-CxC-ucSI.js">
  <link rel="modulepreload" crossorigin href="./build/GCManagedHash-BGrSzuNh.js">
  <link rel="modulepreload" crossorigin href="./build/Filter-DXDffhRK.js">
  <link rel="modulepreload" crossorigin href="./build/RenderTargetSystem-0q-G9kYq.js">
  <link rel="modulepreload" crossorigin href="./build/canvasUtils-O0T_bUdL.js">
  <link rel="stylesheet" crossorigin href="./build/index-KtHj-4JJ.css">
</head>
<body>

<!-- canvas goes here -->
<div id="canvasBox">

    <div class="canvasParent" id="canvasGoesHere"></div>

    <div class="canvasButtons canvasButtonsCenter">
        <div class="canvasButton gdButton" id="copyButton" title="Copy to clipboard"><img src="./assets/button_copy.png"></div>
        <div class="canvasButton gdButton" id="downloadButton" title="Download"><img src="./assets/button_download.png"></div>
    </div>
    <div class="canvasButtons canvasButtonsRight" id="rightMenu">
        <div class="canvasButton gdButton" id="fullscreen" title="Expand preview"><img src="./assets/button_fullscreen.png"></div>
    </div>
    <div class="canvasButtons canvasButtonsRight" id="rightMenuFullscreen" style="display: none">
        <div class="canvasButton gdButton" id="unfullscreen" title="Shrink preview"><img src="./assets/button_unfullscreen.png"></div>
        <div class="canvasButton gdButton" id="fullscreenBG" title="Background color"><img src="./assets/color.png"></div>
    </div>
    <div id="canvasResizer"></div>

    <!-- fullscreen bg color picker -->
    <div id="fullscreenPickerPopup" class="basePicker" style="display: none;">
        <div class="fullscreenColorList" id="fullscreenColors"></div>
    </div>
</div>

<div class="parent fancyScroll">

<div id="config" class="main">

    <!-- character picker -->
    <div id="characterPickerPopup" class="basePicker" style="display: none;">
        <div class="characterGridParent fancyScroll">
            <div id="characterGroups" class="characterGrid">
                <div id="customCharacterUpload">
                    <p>Upload, drag, or paste an image</p>
                    <input id="customCharFileInput" type="file" accept="image/*" style="display: none;">
                </div>
            </div>
        </div>
        <div class="characterLabelParent">
            <h1 id="characterLabel"></h1>
            <h1 id="expressionLabel"></h1>
            <h1 id="creditLabel"></h1>
        </div>
    </div>

    <!-- text effect picker -->
    <div id="textPickerPopup" class="basePicker" style="display: none;">
        <div class="textEffectList" id="textEffects"></div>
        <div class="textColorList" id="textColors"></div>
    </div>

    <!-- background picker -->
    <div id="bgPickerPopup" class="basePicker fancyScroll" style="display: none;">
        <div class="backgroundList" id="textboxBGs"></div>
    </div>

    <div id="textboxBuilder" class="textboxBuilder" style="display: none">

        <div class="configSide configSideLeft">
            <div class="deleteOptions">
                <img class="gdButton deleteBox" title="Delete" src="./assets/button_trash.png">
            </div>
        </div>

        <div class="configBox configMain">

            <!-- column 1: portrait -->
            <div class="configCol configColChar">
                <div class="configPortrait"><img></div>
            </div>

            <!-- column 2: text -->
            <div class="configCol configColText">
                <input class="configTextbox textboxName" type="text" value="" placeholder="">
                <textarea class="configTextbox fancyScroll"></textarea>
            </div>

            <!-- column 3: buttons -->
            <div class="configCol configColButtons">
                <div class="configButton gdButton playTextbox alwaysShow" title="Preview" style="background-image: url('./assets/button_preview.png')"></div>
                <div class="configButton gdButton showTextEffects" title="Text effects"><img src="./assets/texteffect.png"></div>
                <div class="configButton gdButton textboxSettings" title="Settings" style="background-image: url('./assets/button_options.png')"></div>
            </div>

            <!-- corner: background -->     
            <div class="configTopLeft">
                <div class="configButton recolorTextbox gdButton" title="Background color" style="background-image: url('./assets/color.png')"></div>
            </div>

        </div>

        <div class="configBox configSettings fancyScroll" style="display: none">
            <div class="configSettingsCorner">
                <img class="gdButton closeSettings" title="Back" src="./assets/button_close.png">
                <img class="gdButton previewSettings" title="Preview" src="./assets/button_preview.png">
                <img class="gdButton resetSettings" title="Reset" src="./assets/button_reset.png">
            </div>
            <!-- settings are auto-generated via json and my messy code -->
            <div class="configSettingsGroups fancyScroll"></div>
        </div>

        <div class="configSide configSideRight">
            <div class="reorderTextbox">
                <img class="gdButton reorderUp" title="Move up" src="./assets/up.png">
                <img class="gdButton reorderClone" title="Duplicate" src="./assets/duplicate.png">
                <img class="gdButton reorderDown" title="Move down" src="./assets/down.png">
            </div>
        </div>
    </div>


    <div id="textboxList"></div>


    <div style="margin-bottom: 30px">
        <img id="addNewTextbox" class="gdButton newTextbox" title="Add textbox" tabindex="0" src="./assets/button_plus.png">
    </div>

</div>

<!-- footer -->
<div id="footer">
    <div class="footerLeft">
        <p>Website by me</p>
        <p class="smaller footerdiv">&bullet;</p>
        <p>Geometry Dash and its assets belong to <a style="color: aqua" href="https://robtopgames.com" target="_blank">RobTop Games</a></p>
    </div>
    <div class="footerRight">
        <p>WIP</p>
    </div>

    <!-- hack to ensure that pusab loads immediately -->
    <h3 style="opacity: 0%; position: absolute; top: 0px">x</h3>
</div>

</div>


<!-- popups -->
<div id="changelog" class="flalert fragile" style="display: none" role="dialog">
    <div class="alertbox">
        <h1>Changelog</h1>
        <div id="changelogVersions" class="fancyScroll"></div>

        <div class="gdButton closePopup"><img src="./assets/button_close.png"></div>
    </div>
</div>


</body>

</html>
